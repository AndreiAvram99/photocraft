name: Remora downloads

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

concurrency:
  group: remora-downloads-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create a private draft for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 - <<'PYVERSION'
          import tomllib
          with open('Cargo.toml', 'rb') as file:
              print(tomllib.load(file)['workspace']['package']['version'])
          PYVERSION
          )
          tag="remora-${GITHUB_SHA:0:12}"
          if gh release view "$tag" >/dev/null 2>&1; then
            draft=$(gh release view "$tag" --json isDraft --jq '.isDraft')
            [[ "$draft" == true ]] || { echo "Release $tag is already published" >&2; exit 1; }
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" \
              --title "PhotoRay $version (Remora build)" \
              --notes "PhotoRay built automatically from this fork's main commit $GITHUB_SHA. Mac installer is Developer ID signed and Apple notarized. Windows installer is unsigned and may show a SmartScreen warning."
          fi

  mac:
    needs: prepare
    name: Mac Apple Silicon
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Andrei's Ray branding and modifications
        run: |
          python -m pip install Pillow ds_store==1.3.3 mac_alias==2.2.3
          python .remora/prepare.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: remora-mac
      - name: Require Apple signing and notarization credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is required for a notarized Mac release"
              exit 1
            fi
          done
      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: packaging/macos/import-cert.sh
      - name: Build Mac installer
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: packaging/macos/package.sh --arch aarch64
      - name: Verify notarized Mac installer
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/release/*-macos-aarch64.dmg)
          (( ${#files[@]} == 1 )) || { echo 'Expected one Mac installer'; exit 1; }
          retry_check() {
            local attempt
            for attempt in 1 2 3 4 5; do
              if "$@"; then return 0; fi
              (( attempt == 5 )) && return 1
              sleep $((attempt * 5))
            done
          }
          retry_check xcrun stapler validate "${files[0]}"
          retry_check spctl --assess --type open --context context:primary-signature -vv "${files[0]}"
      - name: Upload verified Mac installer to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="remora-${GITHUB_SHA:0:12}"
          gh release upload "$tag" dist/release/*-macos-aarch64.dmg --clobber

  windows:
    needs: prepare
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply Andrei's Ray branding and modifications
        run: |
          python -m pip install Pillow
          python .remora/prepare.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: remora-windows-x64
      - uses: storytold/craft-common-actions/actions/install-wix@main
        with:
          wix-version: 5.0.2
      - name: Build Windows installer
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch x64
      - name: Upload Windows installers to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "remora-" + $env:GITHUB_SHA.Substring(0, 12)
          $files = @(Get-ChildItem -Path 'dist/release/*-windows-x64.msi', 'dist/release/*-windows-x64-portable.zip' | Select-Object -ExpandProperty FullName)
          if ($files.Count -lt 2) { throw 'Both Windows installers are required' }
          gh release upload $tag @files --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload Windows installers' }

  publish:
    name: Publish Mac and Windows downloads
    runs-on: ubuntu-latest
    needs: [mac, windows]
    steps:
      - name: Publish only after all three installers exist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="remora-${GITHUB_SHA:0:12}"
          assets=$(gh release view "$tag" --json assets --jq '.assets[].name')
          for suffix in -macos-aarch64.dmg -windows-x64.msi -windows-x64-portable.zip; do
            if ! grep -Fq -- "$suffix" <<< "$assets"; then
              echo "Missing $suffix from release $tag" >&2
              exit 1
            fi
          done
          gh release edit "$tag" --draft=false
