name: Remora downloads

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

concurrency:
  group: remora-downloads-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    name: Mac Apple Silicon
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Andrei's Craft modifications
        run: |
          python -m pip install Pillow
          python .remora/prepare.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: remora-mac
      - name: Require Apple signing and notarization credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is required for a notarized Mac release"
              exit 1
            fi
          done
      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: packaging/macos/import-cert.sh
      - name: Build Mac installer
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: packaging/macos/package.sh --arch aarch64
      - name: Verify notarized Mac installer
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/release/*-macos-aarch64.dmg)
          (( ${#files[@]} == 1 )) || { echo 'Expected one Mac installer'; exit 1; }
          xcrun stapler validate "${files[0]}"
          spctl --assess --type open --context context:primary-signature -vv "${files[0]}"
      - uses: actions/upload-artifact@v4
        with:
          name: remora-mac
          path: dist/release/*-macos-aarch64.dmg
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply Andrei's Craft modifications
        run: |
          python -m pip install Pillow
          python .remora/prepare.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: remora-windows-x64
      - uses: storytold/craft-common-actions/actions/install-wix@main
        with:
          wix-version: 5.0.2
      - name: Build Windows installer
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch x64
      - uses: actions/upload-artifact@v4
        with:
          name: remora-windows
          path: |
            dist/release/*-windows-x64.msi
            dist/release/*-windows-x64-portable.zip
          if-no-files-found: error

  publish:
    name: Publish Mac and Windows downloads
    runs-on: ubuntu-latest
    needs: [mac, windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: remora-*
          path: release-assets
          merge-multiple: true
      - name: Publish this fork's verified build outputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release-assets/*.dmg release-assets/*.msi release-assets/*.zip)
          (( ${#files[@]} >= 2 )) || { echo 'Both platforms need installers'; exit 1; }
          version=$(python3 - <<'PY'
          import tomllib
          with open('Cargo.toml', 'rb') as file:
              print(tomllib.load(file)['workspace']['package']['version'])
          PY
          )
          tag="remora-${GITHUB_SHA:0:12}"
          gh release create "$tag" "${files[@]}" \
            --target "$GITHUB_SHA" \
            --title "${GITHUB_REPOSITORY#*/} $version (Remora build)" \
            --notes "Built automatically from this fork's main commit $GITHUB_SHA. Mac installer is Developer ID signed and Apple notarized. Windows installer is unsigned and may show a SmartScreen warning."
